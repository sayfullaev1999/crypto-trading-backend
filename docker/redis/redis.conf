bind 0.0.0.0
port 6379
protected-mode yes

requirepass StrongRedisPassword
masterauth StrongRedisPassword
appendonly yes
appendfsync everysec

save 900 1
save 300 10
save 60 10000
repl-diskless-sync yes
repl-diskless-sync-delay 5

repl-timeout 60
repl-ping-replica-period 10
maxmemory-policy allkeys-lru
loglevel notice