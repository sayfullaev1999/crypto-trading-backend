name: CI/CD

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "docker/**"
      - "k8s/backend/**"
      - "k8s/postgres/**"
      - "k8s/redis/**"
      - "k8s/pgbouncer/**"
      - "k8s/cert-manager/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check application import
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          DEBUG: "false"
          POSTGRES_DSN: "postgresql+asyncpg://test:test@localhost:5432/test"
          REDIS_PASSWORD: "test"
          REDIS_SENTINEL_HOSTS: "localhost:26379"
          REDIS_SENTINEL_MASTER_NAME: "mymaster"
          JWT_SECRET_KEY: "test-secret-key"
          WALLET_ENCRYPTION_PASSWORD: "test-password"
          POLYGON_API_KEY: "test-api-key"
        run: |
          python -c "import main"

      - name: Build Docker image
        run: |
          docker build \
            -f docker/app/Dockerfile \
            -t crypto-trading-backend:test \
            .

  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: |
            ghcr.io/sayfullaev1999/crypto-trading-backend:${{ github.sha }}
            ghcr.io/sayfullaev1999/crypto-trading-backend:latest
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure Kubernetes
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          KUBE_CA_CERT: ${{ secrets.KUBE_CA_CERT }}
        run: |
          mkdir -p ~/.kube

          printf '%s\n' "$KUBE_CA_CERT" > ~/.kube/ca.crt

          kubectl config set-cluster k3s \
            --server="$KUBE_SERVER" \
            --certificate-authority="$HOME/.kube/ca.crt"

          kubectl config set-credentials github-actions \
            --token="$KUBE_TOKEN"

          kubectl config set-context k3s \
            --cluster=k3s \
            --user=github-actions \
            --namespace=backend

          kubectl config use-context k3s

      - name: Verify Kubernetes access
        run: |
          kubectl get pods

      - name: Create Cloudflare credentials
        run: |
          kubectl create secret generic cloudflare-api-token \
            -n cert-manager \
            --from-literal=api-token="${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Deploy cert-manager issuer
        run: |
          kubectl apply -f k8s/cert-manager/cluster-issuer.yaml
          kubectl apply -f k8s/cert-manager/certificate.yaml

      - name: Create secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PGBOUNCER_ADMIN_PASSWORD: ${{ secrets.PGBOUNCER_ADMIN_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          WALLET_ENCRYPTION_PASSWORD: ${{ secrets.WALLET_ENCRYPTION_PASSWORD }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          USERLIST_CONTENT=$(printf '"crypto_trading_user" "%s"\n"pgbouncer_admin" "%s"\n' "$POSTGRES_PASSWORD" "$PGBOUNCER_ADMIN_PASSWORD")

          kubectl create secret generic backend-secrets \
            -n backend \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=POSTGRES_DSN="postgresql+asyncpg://crypto_trading_user:${POSTGRES_PASSWORD}@pgbouncer:5432/crypto_trading" \
            --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
            --from-literal=JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            --from-literal=WALLET_ENCRYPTION_PASSWORD="$WALLET_ENCRYPTION_PASSWORD" \
            --from-literal=POLYGON_API_KEY="$POLYGON_API_KEY" \
            --from-literal=userlist.txt="$USERLIST_CONTENT" \
            --from-literal=PGBOUNCER_ADMIN_PASSWORD="$PGBOUNCER_ADMIN_PASSWORD" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Deploy backend config
        run: |
          kubectl apply -f k8s/backend/configmap.yaml

      # Postgres
      - name: Deploy PostgreSQL
        run: |
          kubectl apply -f k8s/postgres/service.yaml
          kubectl apply -f k8s/postgres/statefulset.yaml

      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status \
            statefulset/postgres \
            -n backend \
            --timeout=180s

      # PgBouncer
      - name: Deploy PgBouncer config
        run: |
          kubectl apply -f k8s/pgbouncer/configmap.yaml

      - name: Deploy PgBouncer
        run: |
          kubectl apply -f k8s/pgbouncer/deployment.yaml
          kubectl apply -f k8s/pgbouncer/service.yaml

      - name: Wait for PgBouncer
        run: |
          kubectl rollout status deployment/pgbouncer -n backend --timeout=180s

      - name: Deploy PgBouncer monitoring
        run: |
          kubectl apply -f k8s/pgbouncer/servicemonitor.yaml

      # Redis
      - name: Deploy Redis config
        run: |
          kubectl apply -f k8s/redis/configmap.yaml

      - name: Deploy Redis primary
        run: |
          kubectl apply -f k8s/redis/service.yaml
          kubectl apply -f k8s/redis/primary.yaml

      - name: Deploy Redis replicas
        run: |
          kubectl apply -f k8s/redis/replicas.yaml

      - name: Deploy Redis Sentinel
        run: |
          kubectl apply -f k8s/redis/sentinel.yaml

      - name: Wait for Redis
        run: |
          kubectl rollout status \
            statefulset/redis-primary \
            -n backend \
            --timeout=180s

          kubectl rollout status \
            statefulset/redis-replica \
            -n backend \
            --timeout=180s

          kubectl rollout status \
            statefulset/redis-sentinel \
            -n backend \
            --timeout=180s

      # Alembic
      - name: Run database migrations
        run: |
          kubectl delete job backend-migrations \
            -n backend \
            --ignore-not-found
          sed "s/IMAGE_TAG/${{ github.sha }}/g" \
            k8s/backend/migrations/job.yaml \
            | kubectl apply -f -

      - name: Wait for migrations
        run: |
          kubectl wait \
            --for=condition=complete \
            job/backend-migrations \
            -n backend \
            --timeout=180s

      - name: Show migration logs
        if: always()
        run: |
          kubectl logs job/backend-migrations -n backend

      # API
      - name: Deploy backend API
        run: |
          sed "s/IMAGE_TAG/${{ github.sha }}/g" \
            k8s/backend/api/deployment.yaml \
            | kubectl apply -f -

          kubectl apply -f k8s/backend/api/service.yaml

          kubectl apply -f k8s/backend/api/ingress.yaml
      
      # Workers
      - name: Deploy workers
        run: |
          sed "s/IMAGE_TAG/${{ github.sha }}/g" \
            k8s/backend/workers/binance.yaml \
            | kubectl apply -f -
          sed "s/IMAGE_TAG/${{ github.sha }}/g" \
            k8s/backend/workers/polygon.yaml \
            | kubectl apply -f -

      # -------------------------
      # Rollout
      # -------------------------

      - name: Wait for backend
        run: |
          kubectl rollout status \
            deployment/backend-api \
            -n backend \
            --timeout=180s

          kubectl rollout status \
            deployment/backend-binance-worker \
            -n backend \
            --timeout=180s

          kubectl rollout status \
            deployment/backend-polygon-worker \
            -n backend \
            --timeout=180s

      # Final status
      - name: Show cluster status
        if: always()
        run: |
          echo "=== PODS ==="
          kubectl get pods -n backend -o wide

          echo "=== SERVICES ==="
          kubectl get svc -n backend

          echo "=== DEPLOYMENTS ==="
          kubectl get deployments -n backend

          echo "=== STATEFULSETS ==="

          kubectl get statefulsets -n backend