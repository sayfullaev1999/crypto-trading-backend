name: Deploy Monitoring

on:
  push:
    branches:
      - master
    paths:
      - "k8s/monitoring/**"
      - ".github/workflows/deploy-monitoring.yml"

  workflow_dispatch:

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # -------------------------
      # Checkout
      # -------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # Kubernetes
      # -------------------------

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # -------------------------
      # Kubernetes access
      # -------------------------

      - name: Configure Kubernetes access
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_TOKEN: ${{ secrets.MONITORING_KUBE_TOKEN }}
          KUBE_CA_CERT: ${{ secrets.KUBE_CA_CERT }}
        run: |
          mkdir -p ~/.kube

          printf '%s\n' "$KUBE_CA_CERT" > ~/.kube/ca.crt

          kubectl config set-cluster k3s \
            --server="$KUBE_SERVER" \
            --certificate-authority="$HOME/.kube/ca.crt"

          kubectl config set-credentials monitoring \
            --token="$KUBE_TOKEN"

          kubectl config set-context monitoring \
            --cluster=k3s \
            --user=monitoring \
            --namespace=monitoring

          kubectl config use-context monitoring

      # -------------------------
      # Verify access
      # -------------------------

      - name: Verify Kubernetes access
        run: |
          echo "=== CURRENT USER ==="
          kubectl auth whoami

          echo ""
          echo "=== PERMISSIONS ==="
          kubectl auth can-i get pods -n monitoring
          kubectl auth can-i create deployments -n monitoring
          kubectl auth can-i create statefulsets -n monitoring
          kubectl auth can-i create daemonsets -n monitoring
          kubectl auth can-i create customresourcedefinitions
          kubectl auth can-i create ingresses -n monitoring

      # -------------------------
      # Helm
      # -------------------------

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Prometheus Helm repository
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Add Grafana Community Helm repository
        run: |
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo update

      - name: Add Grafana Helm repository
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      # -------------------------
      # Prometheus + Grafana + Loki + Alloy
      # -------------------------

      - name: Deploy kube-prometheus-stack
        run: |
          helm upgrade --install monitoring \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --values k8s/monitoring/prometheus-values.yaml \
            --wait \
            --timeout 10m

      - name: Deploy Loki
        run: |
          helm upgrade --install loki \
            grafana-community/loki \
            --namespace monitoring \
            --values k8s/monitoring/loki-values.yaml \
            --wait \
            --timeout 10m

      - name: Deploy Alloy
        run: |
          helm upgrade --install alloy \
            grafana/alloy \
            --namespace monitoring \
            --values k8s/monitoring/alloy-values.yaml \
            --wait \
            --timeout 10m

      # -------------------------
      # Grafana Ingress
      # -------------------------

      - name: Deploy Grafana Ingress
        run: |
          kubectl apply \
            -f k8s/monitoring/grafana-ingress.yaml

      # -------------------------
      # Verification
      # -------------------------

      - name: Show monitoring status
        if: always()
        run: |
          echo "=== PODS ==="
          kubectl get pods -n monitoring -o wide

          echo ""
          echo "=== SERVICES ==="
          kubectl get svc -n monitoring

          echo ""
          echo "=== INGRESS ==="
          kubectl get ingress -n monitoring

          echo ""
          echo "=== STATEFULSETS ==="
          kubectl get statefulsets -n monitoring

          echo ""
          echo "=== DEPLOYMENTS ==="
          kubectl get deployments -n monitoring

          echo ""
          echo "=== DAEMONSETS ==="
          kubectl get daemonsets -n monitoring

          echo ""
          echo "=== MONITORING CRDS ==="
          kubectl get crd | grep monitoring.coreos.com || true