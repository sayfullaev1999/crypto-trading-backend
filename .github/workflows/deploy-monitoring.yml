name: Deploy Monitoring

on:
  push:
    branches:
      - master
    paths:
      - "k8s/monitoring/**"
      - ".github/workflows/deploy-monitoring.yml"

  workflow_dispatch:

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Kubernetes bootstrap access
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_TOKEN: ${{ secrets.MONITORING_KUBE_TOKEN }}
          KUBE_CA_CERT: ${{ secrets.KUBE_CA_CERT }}
        run: |
          mkdir -p ~/.kube

          printf '%s\n' "$KUBE_CA_CERT" > ~/.kube/ca.crt

          kubectl config set-cluster k3s \
            --server="$KUBE_SERVER" \
            --certificate-authority="$HOME/.kube/ca.crt"

          kubectl config set-credentials bootstrap \
            --token="$KUBE_TOKEN"

          kubectl config set-context bootstrap \
            --cluster=k3s \
            --user=bootstrap

          kubectl config use-context bootstrap

      - name: Check monitoring permissions
        run: |
          echo "=== CURRENT USER ==="
          kubectl auth whoami
          echo ""
          echo "=== NAMESPACE ==="
          kubectl auth can-i get namespaces
          echo ""
          echo "=== SERVICE ACCOUNT ==="
          kubectl auth can-i create serviceaccounts -n monitoring
          echo ""
          echo "=== WORKLOADS ==="
          kubectl auth can-i create deployments -n monitoring
          kubectl auth can-i create statefulsets -n monitoring
          kubectl auth can-i create daemonsets -n monitoring
          echo ""
          echo "=== RBAC ==="
          kubectl auth can-i create clusterroles
          kubectl auth can-i create clusterrolebindings
          echo ""
          echo "=== CRDs ==="
          kubectl auth can-i create customresourcedefinitions
