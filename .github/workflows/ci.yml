name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check application import
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          DEBUG: "false"
          POSTGRES_DSN: "postgresql+asyncpg://test:test@localhost:5432/test"
          REDIS_PASSWORD: "test"
          REDIS_SENTINEL_HOSTS: "localhost:26379"
          REDIS_SENTINEL_MASTER_NAME: "mymaster"
          JWT_SECRET_KEY: "test-secret-key"
          WALLET_ENCRYPTION_PASSWORD: "test-password"
          POLYGON_API_KEY: "test-api-key"
        run: |
          python -c "import main"

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/app/Dockerfile \
            -t crypto-trading-backend:test \
            .
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: |
            ghcr.io/sayfullaev1999/crypto-trading-backend:${{ github.sha }}
            ghcr.io/sayfullaev1999/crypto-trading-backend:latest