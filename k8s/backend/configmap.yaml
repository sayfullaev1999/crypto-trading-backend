apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: backend

data:
  DEBUG: "false"

  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "crypto_trading"
  POSTGRES_USER: "crypto_trading_user"

  REDIS_SENTINEL_HOSTS: "redis-sentinel-0.redis-sentinel:26379,redis-sentinel-1.redis-sentinel:26379,redis-sentinel-2.redis-sentinel:26379"
  REDIS_SENTINEL_MASTER_NAME: "mymaster"

  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_SECONDS: "86400"
  JWT_REFRESH_TOKEN_EXPIRE_SECONDS: "604800"