apiVersion: v1
kind: Service
metadata:
  name: redis-primary
  namespace: backend

spec:
  selector:
    app: redis-primary

  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: backend

spec:
  clusterIP: None

  selector:
    app: redis-sentinel

  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379