apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-trading-backend
  namespace: backend
spec:
  replicas: 2

  selector:
    matchLabels:
      app: crypto-trading-backend

  template:
    metadata:
      labels:
        app: crypto-trading-backend

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/sayfullaev1999/crypto-trading-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000