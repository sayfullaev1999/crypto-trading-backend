apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: backend
  labels:
    app: pgbouncer
spec:
  replicas: 2

  selector:
    matchLabels:
      app: pgbouncer

  template:
    metadata:
      labels:
        app: pgbouncer

    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.24.1-p1
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          volumeMounts:
            - name: pgbouncer-config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true

            - name: pgbouncer-auth
              mountPath: /etc/pgbouncer/userlist.txt
              subPath: userlist.txt
              readOnly: true

          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 15
            periodSeconds: 20

        - name: pgbouncer-exporter
          image: quay.io/prometheuscommunity/pgbouncer-exporter:v0.12.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9127
              protocol: TCP
          args:
            - --pgBouncer.connectionString=postgres://pgbouncer_admin:$(PGBOUNCER_ADMIN_PASSWORD)@localhost:5432/pgbouncer
          env:
            - name: PGBOUNCER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: PGBOUNCER_ADMIN_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20

      volumes:
        - name: pgbouncer-config
          configMap:
            name: pgbouncer-config

        - name: pgbouncer-auth
          secret:
            secretName: backend-secrets
