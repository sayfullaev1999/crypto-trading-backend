apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: backend
data:
  pgbouncer.ini: |
    [databases]
    crypto_trading = host=postgres port=5432 dbname=crypto_trading

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432

    auth_type = plain
    auth_file = /etc/pgbouncer/userlist.txt

    pool_mode = transaction

    max_client_conn = 200
    default_pool_size = 20
    min_pool_size = 5
    reserve_pool_size = 5
    reserve_pool_timeout = 5

    server_idle_timeout = 600
    server_lifetime = 3600

    admin_users = pgbouncer_admin

    log_connections = 1
    log_disconnections = 1
    verbose = 0